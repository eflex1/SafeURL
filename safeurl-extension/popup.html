<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>SafeURL</h2>
      </div>

      <div class="status-box" id="statusBox">
        <p id="statusText">Scanning...</p>
        <h1 id="riskScore">--%</h1>
        <p class="risk-label">Risk Score</p>
      </div>

      <div class="details">
        <p class="truncate" id="currentUrl">Waiting for URL...</p>
      </div>

      <button id="scanBtn">Force Scan</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
